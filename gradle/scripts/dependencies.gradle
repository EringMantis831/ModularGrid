apply from: 'gradle/scripts/helpers.gradle'

repositories {
    // CleanroomMC, MinecraftForge, FabricMC and WagYourTail are added by the build.gradle
    maven {
        name 'CleanroomMC CurseMaven'
        url 'https://curse.cleanroommc.com'
    }
    maven {
        name 'Modrinth'
        url 'https://api.modrinth.com/maven'
    }
    maven {
        // CraftTweaker 2
        name 'BlameJared'
        url 'https://maven.blamejared.com/'
    }
    maven {
        // GeckoLib, an optional dependency of MMCE
        name 'GeckoLib'
        url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
    }
    mavenCentral()
    mavenLocal() // Must be last for caching to work
}

dependencies {
    // ----------------------------------------------------------------------------------------------------------------
    // Modular Machinery: Community Edition
    // ----------------------------------------------------------------------------------------------------------------
    // Compiled against MMCE's *release* jar from CurseMaven. Unimined deobfuscates it, so the mod is available under
    // MCP names here (same names this project is compiled with) and the built jar links against MMCE's SRG names at
    // runtime.
    modCompileOnly "curse.maven:${propertyString('mmce_curse_file')}"

    // CraftTweaker's scripting API (zenscript annotations, bracket handlers, global symbols, IEventHandler) is what the
    // optional scripting integration in com.modulargrid.common.integration.crafttweaker compiles against: pack authors use
    // it to drive channel data from recipes. Compile only - the integration is guarded by Loader.isModLoaded, and the
    // release jar is already in run/<side>/mods above.
    modCompileOnly "curse.maven:${propertyString('crafttweaker_curse_file')}"

    // MMCE's TileMultiblockMachineController implements GeckoLib's IAnimatable, so GeckoLib has to be on the compile
    // class path before members of that type can be resolved (the controller cannot even be handed a TileEntity method
    // otherwise). It is strictly compile only: none of our classes reference GeckoLib types, and GeckoLib stays an
    // optional runtime dependency exactly like it is for MMCE itself.
    compileOnly 'software.bernie.geckolib:geckolib-forge-1.12.2:3.0.31'

    // MMCE is a coremod that depends on CraftTweaker, and both must be loaded by the launch class loader. Dropping the
    // real release jars into run/<side>/mods is the only reliable way to do that (putting them on the run class path
    // loads them from the app class loader and MMCE's mixin loader then cannot see MixinBooter's interfaces).
    // `syncRunMods` copies them before every run, see build.gradle.
    runMods("curse.maven:${propertyString('mmce_curse_file')}") { transitive = false }
    runMods("curse.maven:${propertyString('crafttweaker_curse_file')}") { transitive = false }

    // CodeChickenLib is only needed to compile the optional compatibility mixin that keeps it working on
    // modern Java (see CodeChickenLibReflectionMixin). Nothing ModularGrid ships refers to it, so a local
    // jar in libs/dev is enough for the compiler and the mod itself stays an optional runtime neighbour.
    compileOnly files('libs/dev/CodeChickenLib-1.12.2-3.2.3.358-universal.jar')

    // IndustrialCraft 2 is an optional neighbour: the access plug speaks its energy net (EU) on top of Forge
    // Energy, so the API has to be on the compile class path for the @Optional interface methods. Nothing is
    // linked unless IC2 is actually installed, and the mod stays optional - see TileAccessPlug.
    modCompileOnly "curse.maven:${propertyString('ic2_curse_file')}"

    // JEI is *not* a dependency of ModularGrid, but MMCE's GUIs (blueprint preview, machine controller recipe slots)
    // reference JEI renderer classes unconditionally, so opening any of them without JEI throws NoClassDefFoundError.
    // The `dev` classifier jar is MCP named, which is what a development environment needs, and it lands in
    // run/<side>/mods together with the other development jars.
    runMods('mezz:jei:4.35.0:dev') { transitive = false }

    // IC2 in the development runs, so the EU side of the access plug can be exercised in-game.
    runMods("curse.maven:${propertyString('ic2_curse_file')}") { transitive = false }

    // ----------------------------------------------------------------------------------------------------------------
    // Wireless energy networks
    // ----------------------------------------------------------------------------------------------------------------
    // Both are optional neighbours, and both are only referenced from com.modulargrid.common.integration.*, which is
    // guarded by Loader.isModLoaded - the same model the IC2 support uses. They are compile only so their APIs are
    // available under MCP names, and they are dropped into run/<side>/mods so the integrations can actually be
    // exercised in the development client.
    // Circulation Flow Networks is compile only for the same reason, but its development jar is *not* taken from
    // CurseMaven: its own mixins are written against SRG names, which a development environment cannot resolve
    // (FML's deobfuscating transformer only rewrites ordinary mod classes, and Mixin's refmap only covers the
    // references a mod lists in its own refmap - CFN's @Shadow members are not in it).
    // Unimined already produces an MCP named copy of the jar for the compile class path, and build.gradle copies
    // that one into run/<side>/mods instead. See "Development only copy of Circulation Flow Networks" there.
    modCompileOnly "curse.maven:${propertyString('fluxnetworks_curse_file')}"
    modCompileOnly "curse.maven:${propertyString('circulation_networks_curse_file')}"

    runMods("curse.maven:${propertyString('fluxnetworks_curse_file')}") { transitive = false }

    // Example - Dependency descriptor:
    // 'com.google.code.gson:gson:2.8.6' << group: com.google.code.gson, name:gson, version:2.8.6
    // 'group:name:version:classifier' where classifier is optional

    // Example - Mod dependencies (remapped from SRG to MCP automatically):
    // modImplementation 'mezz:jei:4.35.0:dev' << dependency available at compile time and runtime
    // modCompileOnly 'mezz:jei:4.35.0:dev'    << dependency available only at compile time
    // modRuntimeOnly 'mezz:jei:4.35.0:dev'    << dependency available only at runtime
    // NOTE: mod* configurations must be used for ordinary mod jars (they are SRG named), MMCE above is the exception
    //       because its jar is already a development jar.

    // Example - CurseMaven dependencies:
    // 'curse.maven:had-enough-items-557549:4543375' << had-enough-items = project slug, 557549 = project id, 4543375 = file id
    // Full documentation: https://cursemaven.com/

    // Example - Modrinth dependencies:
    // 'maven.modrinth:jei:4.16.1.1000' << jei = project name, 4.16.1.1000 = file version
    // Full documentation: https://docs.modrinth.com/docs/tutorials/maven/

    // Common dependency types (configuration):
    // implementation     = dependency available at both compile time and runtime
    // compileOnly        = compile time dependency
    // runtimeOnly        = runtime dependency
    // annotationProcessor = annotation processing dependencies
    // contain            = bundles the dependency inside the output jar (jar-in-jar, Cleanroom ContainedDeps)
    // shadow             = shades the dependency into the shadow jar (relocation configurable in the shadowJar task)
    // modImplementation  = mod dependency available at both compile time and runtime, remapped to MCP names
    // modCompileOnly     = mod dependency available only at compile time, remapped to MCP names
    // modRuntimeOnly     = mod dependency available only at runtime, remapped to MCP names

    // Transitive dependencies:
    // (Dependencies that your dependency depends on)
    // If you wish to exclude transitive dependencies in the described dependencies
    // Use a closure as such:
    // implementation ('com.google.code.gson:gson:2.8.6') {
    //     transitive = false
    // }
}
