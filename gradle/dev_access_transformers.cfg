# Development-only access transformers (MCP names, which is what Unimined expects for user AT files).
# (blank separator removed: the AT tool rejects a lone '#')
# Referenced from build.gradle (unimined.minecraft.cleanroom.accessTransformer), so these are applied to the
# *development* Minecraft jar only - nothing is shipped in the built jar and no FMLAT entry is written.
# (blank separator removed: the AT tool rejects a lone '#')
# Why: a mod relying on its own access transformer (CraftTweaker, which MMCE requires) otherwise crashes in a
# dev environment, because access transformers inside mod jars are SRG named while a Cleanroom dev environment
# is MCP named, and Cleanroom applies mod access transformers verbatim.
# (blank separator removed: the AT tool rejects a lone '#')
# Below is the CraftTweaker AT set converted from SRG to MCP. Keep in sync when adding mods that carry access
# transformers to run/<side>/mods.
