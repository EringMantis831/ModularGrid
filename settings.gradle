pluginManagement {
    repositories {
        gradlePluginPortal() {
            // Log4j is provided by the Minecraft toolchain; a stray one breaks it
            content {
                excludeGroup('org.apache.logging.log4j')
            }
        }
        mavenCentral()
        maven {
            name 'MinecraftForge'
            url 'https://maven.minecraftforge.net/'
        }
        maven {
            name 'FabricMC'
            url 'https://maven.fabricmc.net/'
        }
        maven {
            name 'WagYourTail Releases'
            url 'https://maven.wagyourtail.xyz/releases'
        }
        maven {
            // Unimined fork that carries Cleanroom Loader support
            name 'Arcseekers Releases'
            url 'https://maven.arcseekers.com/releases'
        }
        maven {
            name 'WagYourTail Snapshots'
            url 'https://maven.wagyourtail.xyz/snapshots'
        }
    }
}

plugins {
    // Automatic toolchain provisioning (downloads JDK 25 when it is missing locally)
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

// Due to an IntelliJ bug, this has to be done
// rootProject.name = archives_base_name
rootProject.name = 'ModularGrid'
