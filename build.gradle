/**
 * Cleanroom 1.12.2 mod development workspace.
 *
 * Toolchain: Unimined (Cleanroom fork) + Cleanroom Loader + Java 25
 * It is advised that you do not edit anything in the build.gradle; unless you are sure of what you are doing
 */
import net.darkhax.curseforgegradle.TaskPublishCurseForge
import org.jetbrains.changelog.Changelog
import org.jetbrains.gradle.ext.Gradle

plugins {
    id 'java'
    id 'java-library'
    id 'maven-publish'
    id 'org.jetbrains.gradle.plugin.idea-ext' version '1.4.1'
    // Unimined fork with Cleanroom Loader support, hosted on maven.arcseekers.com
    id 'xyz.wagyourtail.unimined' version '1.4.43-kappa'
    id 'net.darkhax.curseforgegradle' version '1.+' apply false
    id 'com.modrinth.minotaur' version '2.+' apply false
    id 'org.jetbrains.changelog' version '2.5.0'
    id 'com.gradleup.shadow' version '9.6.+'
}

apply from: 'gradle/scripts/helpers.gradle'

// Early Assertions
assertProperty 'mod_version'
assertProperty 'root_package'
assertProperty 'mod_id'
assertProperty 'mod_name'
assertProperty 'cleanroom_version'

assertSubProperties 'use_tags', 'tag_class_name'
assertSubProperties 'use_access_transformer', 'access_transformer_locations'
assertSubProperties 'use_mixins', 'mixin_configs'
assertSubProperties 'is_coremod', 'coremod_includes_mod', 'coremod_plugin_class_name'
assertSubProperties 'use_asset_mover', 'asset_mover_version'

setDefaultProperty 'java_version', true, '25'
setDefaultProperty 'generate_sources_jar', true, true
setDefaultProperty 'generate_javadocs_jar', true, false
setDefaultProperty 'enable_shadow', false, false
setDefaultProperty 'enable_lwjglx', false, true
setDefaultProperty 'enable_junit_testing', true, true
setDefaultProperty 'show_testing_output', false, false
setDefaultProperty 'mapping_channel', true, 'stable'
setDefaultProperty 'mapping_version', true, '39-1.12'
setDefaultProperty 'minecraft_username', true, 'Developer'
setDefaultProperty 'extra_jvm_args', false, ''
setDefaultProperty 'extra_tweak_classes', false, ''
setDefaultProperty 'enable_foundation_debug', false, false
setDefaultProperty 'publish_to_maven', true, false
setDefaultProperty 'publish_to_curseforge', true, false
setDefaultProperty 'publish_to_modrinth', true, false
setDefaultProperty 'mixin_connector_class', false, ''
setDefaultProperty 'mixin_package', true, "${propertyString('root_package')}.mixin"
setDefaultProperty 'generate_mixins_json', true, false

// Plain Java values, safe to capture inside nested closures
def javaVersionNumber = Integer.parseInt(propertyString('java_version'))
def javaVersion = JavaVersion.toVersion(propertyString('java_version'))
def useMixins = propertyBool('use_mixins')
def useAccessTransformer = propertyBool('use_access_transformer')
def useShadow = propertyBool('enable_shadow')
def isCoremod = propertyBool('is_coremod')

version = propertyString('mod_version')
group = propertyString('root_package')

base {
    archivesName.set(propertyString('mod_id'))
}

java {
    toolchain {
        languageVersion.set(JavaLanguageVersion.of(javaVersionNumber))
    }
    if (propertyBool('generate_sources_jar')) {
        withSourcesJar()
    }
    if (propertyBool('generate_javadocs_jar')) {
        withJavadocJar()
    }
}

compileJava {
    sourceCompatibility = targetCompatibility = javaVersion
    options.encoding = 'UTF-8'
}

compileTestJava {
    sourceCompatibility = targetCompatibility = javaVersion
}

configurations {
    // "contain" bundles jars inside the output jar (Cleanroom ContainedDeps / jar-in-jar)
    contain
    implementation.extendsFrom(contain)
    // Mod dependencies
    modCompileOnly
    compileOnly.extendsFrom(modCompileOnly)
    modRuntimeOnly
    runtimeOnly.extendsFrom(modRuntimeOnly)
    // External mods that are copied into run/<side>/mods for the development runs, see syncRunMods below
    runMods {
        canBeConsumed = false
        canBeResolved = true
        transitive = false
    }
}

// Values captured for the run configurations below
def runUsername = propertyString('minecraft_username')
def extraTweakClasses = propertyStringList('extra_tweak_classes')
def extraJvmArgs = propertyString('extra_jvm_args')
def foundationDebug = propertyBool('enable_foundation_debug')
def coremodPluginClass = isCoremod ? propertyString('coremod_plugin_class_name') : ''

//noinspection GroovyAssignabilityCheck
unimined.minecraft {
    version '1.12.2'

    mappings {
        mcp(propertyString('mapping_channel'), propertyString('mapping_version'))
    }

    cleanroom {
        // Development-only access transformers, applied to the Minecraft dev jar. Mods that ship their own
        // (SRG named) access transformers - CraftTweaker for example - cannot have them applied in a dev
        // environment by Cleanroom itself, so they are listed there instead.
        accessTransformer file('gradle/dev_access_transformers.cfg')
        if (useAccessTransformer) {
            accessTransformer file("src/main/resources/${propertyString('access_transformer_locations')}")
        }
        loader propertyString('cleanroom_version')
        runs.all {
            args += ['--username', runUsername]
            for (String tweakClass : extraTweakClasses) {
                args += ['--tweakClass', tweakClass]
            }
            if (extraJvmArgs != null && !extraJvmArgs.trim().isEmpty()) {
                // Groovy's String.split(Closure) splits into characters, which turned multi argument
                // values into one broken JVM argument - tokenize() splits on whitespace instead
                jvmArgs += extraJvmArgs.tokenize()
            }
            if (foundationDebug) {
                systemProperty('foundation.dump', 'true')
                systemProperty('foundation.verbose', 'true')
            }
            // Some 1.12.2 mods (CodeChickenLib, and therefore anything using it) read the ForgeGradle
            // GradleStart system properties to build their SRG <-> notch/mcp mapper and crash with an NPE
            // when they are absent, which is always the case here because Unimined is not ForgeGradle.
            // The files themselves are generated by the `cclMappings` task below; the properties only point
            // at them, and mods that do not care simply ignore them.
            def cclMappings = layout.projectDirectory.dir('run/ccl_mappings').asFile
            if (cclMappings.isDirectory()) {
                systemProperty('net.minecraftforge.gradle.GradleStart.srg.notch-srg',
                        new File(cclMappings, 'notch-srg.srg').absolutePath)
                systemProperty('net.minecraftforge.gradle.GradleStart.csvDir', cclMappings.absolutePath)
            }
            if (!coremodPluginClass.isEmpty()) {
                systemProperty('fml.coreMods.load', coremodPluginClass)
            }
        }
    }

    defaultRemapJar = false

    String jarTaskName = useShadow ? 'shadowJar' : 'jar'

    remap(tasks.named(jarTaskName).get()) {
        if (useMixins) {
            mixinRemap {
                enableBaseMixin()
                enableMixinExtra()
            }
        }
    }

    mods {
        remap(configurations.modCompileOnly)
        remap(configurations.modRuntimeOnly)
    }
}

repositories {
    maven {
        name 'CleanroomMC'
        url 'https://maven.cleanroommc.com'
    }
    maven {
        // Mojang / Forge libraries used by the toolchain
        name 'MinecraftForge'
        url 'https://maven.minecraftforge.net/'
    }
    maven {
        name 'FabricMC'
        url 'https://maven.fabricmc.net/'
    }
    maven {
        name 'WagYourTail'
        url 'https://maven.wagyourtail.xyz/releases'
    }
}

dependencies {
    if (propertyBool('enable_lwjglx')) {
        // LWJGL2 compatibility layer shipped by Cleanroom
        compileOnly "com.cleanroommc:lwjglx:1.0.0"
    }
    if (propertyBool('use_asset_mover')) {
        implementation "com.cleanroommc:assetmover:${propertyString('asset_mover_version')}"
    }
    if (propertyBool('enable_junit_testing')) {
        testImplementation 'org.junit.jupiter:junit-jupiter:6.0.3'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
        // Unit tests may touch Minecraft/Cleanroom classes (NBTTagCompound for example) and our own
        // compiled classes, so they need the same class path the main source set uses.
        testImplementation sourceSets.main.output
        testImplementation sourceSets.main.compileClasspath
        testRuntimeOnly sourceSets.main.runtimeClasspath
    }
}

apply from: 'gradle/scripts/dependencies.gradle'

// ---------------------------------------------------------------------------------------------------------------------
// Development runs
// ---------------------------------------------------------------------------------------------------------------------

// Mods that have to live in run/<side>/mods instead of on the run class path (coremods, MixinBooter implementors).
def copyRunModsTask(String side) {
    return tasks.register("copyRunMods${side.capitalize()}", Copy) {
        group = 'cleanroom helpers'
        description = "Copies the external mods needed by run${side.capitalize()} into run/${side}/mods"
        from configurations.runMods
        into layout.projectDirectory.dir("run/${side}/mods")
    }
}

def clientRunMods = copyRunModsTask('client')
def serverRunMods = copyRunModsTask('server')
tasks.matching { it.name == 'runClient' }.configureEach { dependsOn clientRunMods }
tasks.matching { it.name == 'runServer' }.configureEach { dependsOn serverRunMods }

// Development runs with mixins
// ---------------------------------------------------------------------------------------------------------------------
// Cleanroom 0.6.0-alpha processes the "crl.dev.mixin" system property (and therefore the mixin config) while
// initialising Mixin, which happens *before* Unimined's "crl.dev.extrapath" entries reach the launch class
// loader. A config declared that way therefore fails with "resource was invalid or could not be read"
// (Cleanroom queues those configs later since 0.6.10). Adding the dev jar to the regular class path instead
// makes the game load the mod from the application class loader, where @SidedProxy annotation lookup blows up
// with a NPE because Forge's classes live in the launch class loader.
//
// Both problems disappear when the mod is loaded the same way it is in production: the dev jar is copied into
// run/<side>/mods and its "MixinConfigs" manifest entry is picked up by Cleanroom's mod discovery.
if (useMixins) {
    def devJarFile = tasks.named('jar').flatMap { it.archiveFile }
    def copyDevJarTasks = ['client', 'server'].collect { String side ->
        tasks.register("copyDevJar${side.capitalize()}", Copy) {
            group = 'cleanroom helpers'
            description = "Copies the development jar of this mod into run/${side}/mods"
            dependsOn 'jar'
            from devJarFile
            into layout.projectDirectory.dir("run/${side}/mods")
        }
    }
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn copyDevJarTasks[0] }
    tasks.matching { it.name == 'runServer' }.configureEach { dependsOn copyDevJarTasks[1] }
    tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach { runTask ->
        runTask.doFirst {
            // Drop the directory based extra path, otherwise the mod would be discovered twice: once from the
            // development classes and once from the jar inside run/<side>/mods.
            runTask.setJvmArgs(runTask.jvmArgs.findAll { !it.startsWith('-Dcrl.dev.extrapath=') })
        }
    }
}

// Mod refmaps in development
// ---------------------------------------------------------------------------------------------------------------------
// (nothing to do here - a mod whose mixins are written against SRG names is handled in the development copy made for
// it, see "Mod refmaps in development" below)

// Development only copy of Circulation Flow Networks
// ---------------------------------------------------------------------------------------------------------------------
// CFN's mixins are compiled against SRG names: the members they @Shadow (TileEntity.getPos and friends) are written as
// func_xxx, and its own refmap only lists the members it injects into. Production runs on SRG named classes, so that
// works there, but a development environment runs on MCP named ones, and neither mechanism that could translate them
// does: FML's deobfuscating transformer only rewrites ordinary mod classes (not mixin classes, which are handled by
// Mixin), and Mixin's refmap handling does not cover the shadow declarations.
//
// Unimined already builds an MCP named copy of every mod jar for the compile class path, so the development runs are
// given that copy. Its refmap (which maps MCP names to SRG names) is emptied out in the copy: with MCP named classes
// the mixins need no remapping at all, and leaving the refmap in would map the names straight back into SRG.
// Nothing of this ends up in the mod: it only writes into run/<side>/mods, which is not part of the build.

/** Copies a mod jar, replacing its refmap with an empty one (see the note above). */
def rewriteCfnDevJar(File source, File target) {
    String refmapName = 'mixins.circulation_networks.refmap.json'
    byte[] emptyRefmap = '{"mappings":{},"data":{"searge":{}}}'.getBytes('UTF-8')
    int copied = 0
    new java.util.zip.ZipInputStream(new FileInputStream(source)).withCloseable { input ->
        new java.util.zip.ZipOutputStream(new FileOutputStream(target)).withCloseable { output ->
            byte[] buffer = new byte[8192]
            java.util.zip.ZipEntry entry
            while ((entry = input.nextEntry) != null) {
                if (entry.name == refmapName) {
                    continue
                }
                output.putNextEntry(new java.util.zip.ZipEntry(entry.name))
                int read
                while ((read = input.read(buffer)) != -1) {
                    output.write(buffer, 0, read)
                }
                output.closeEntry()
                copied++
            }
            output.putNextEntry(new java.util.zip.ZipEntry(refmapName))
            output.write(emptyRefmap)
            output.closeEntry()
        }
    }
    logger.info("Copied ${copied} entries of ${source.name} and emptied its refmap")
}

if (useMixins) {
    def cfnDevJar = layout.buildDirectory.file('dev_mods/circulation-flow-networks-dev.jar')
    def compilePath = sourceSets.main.compileClasspath
    def prepareCfnDevJar = tasks.register('prepareCfnDevJar') {
        group = 'cleanroom helpers'
        description = 'Copies the MCP named development jar of Circulation Flow Networks for the development runs'
        inputs.files(compilePath)
        outputs.file(cfnDevJar)
        doLast {
            File source = compilePath.files.find { File file ->
                file.name.startsWith('circulation-flow-networks-') && file.name.endsWith('.jar')
            }
            if (source == null) {
                throw new GradleException('Circulation Flow Networks is not on the compile class path, so its ' +
                        'MCP named development jar cannot be prepared for the development runs.')
            }
            File target = cfnDevJar.get().asFile
            target.parentFile.mkdirs()
            rewriteCfnDevJar(source, target)
            logger.lifecycle("Prepared development jar of Circulation Flow Networks from ${source}")
        }
    }
    ['client', 'server'].each { String side ->
        tasks.register("copyCfnDevJar${side.capitalize()}", Copy) {
            group = 'cleanroom helpers'
            description = "Copies the MCP named Circulation Flow Networks jar into run/${side}/mods"
            dependsOn prepareCfnDevJar
            from cfnDevJar
            into layout.projectDirectory.dir("run/${side}/mods")
            // The released jar is never used in development, drop it in case an earlier run copied it.
            doFirst {
                file("run/${side}/mods").listFiles()?.each { File file ->
                    if (file.name.startsWith('circulation-flow-networks-1519385-')) {
                        file.delete()
                    }
                }
            }
        }
    }
    tasks.matching { it.name == 'runClient' }.configureEach { dependsOn 'copyCfnDevJarClient' }
    tasks.matching { it.name == 'runServer' }.configureEach { dependsOn 'copyCfnDevJarServer' }
}

// ---------------------------------------------------------------------------------------------------------------------
// Tags (build-time generated constants)
// ---------------------------------------------------------------------------------------------------------------------

def tagsOutDir = layout.buildDirectory.dir('generated/sources/tags/java/main')
def tagsPropertiesFile = file('tags.properties')
def tagClassName = propertyString('tag_class_name')
def tagPackage = tagClassName.substring(0, tagClassName.lastIndexOf('.'))
def tagSimpleName = tagClassName.substring(tagClassName.lastIndexOf('.') + 1)

if (propertyBool('use_tags')) {
    if (!tagsPropertiesFile.exists()) {
        throw new GradleException('use_tags is true, but tags.properties does not exist in the workspace!')
    }
    def tagValues = new Properties()
    tagsPropertiesFile.withInputStream { tagValues.load(it) }
    def resolvedTags = tagValues.collectEntries { key, value ->
        def interpolated = interpolate(value.toString())
        if (interpolated == null || interpolated.isEmpty()) {
            throw new GradleException("Empty tag value found for key: ${key}")
        }
        [(key.toString()): interpolated.toString()]
    }
    if (resolvedTags.isEmpty()) {
        throw new GradleException('use_tags is true, but tags.properties is empty!')
    }

    tasks.register('generateTags') {
        group = 'cleanroom helpers'
        description = 'Generates the Tags class from tags.properties'
        inputs.properties(resolvedTags)
        outputs.dir(tagsOutDir)
        doLast {
            def outputFile = tagsOutDir.get().file("${tagPackage.replace('.', '/')}/${tagSimpleName}.java").asFile
            outputFile.parentFile.mkdirs()
            def fields = resolvedTags.collect { key, value ->
                "    public static final String ${key} = \"${value}\";"
            }.join('\n')
            outputFile.text = """package ${tagPackage};

/**
 * Generated by the generateTags task from tags.properties - do not edit.
 */
public class ${tagSimpleName} {
${fields}

    private ${tagSimpleName}() {
    }
}
"""
        }
    }

    sourceSets.main.java.srcDir(tagsOutDir)
    tasks.named('compileJava').configure { dependsOn 'generateTags' }
    tasks.matching { it.name in ['sourcesJar', 'javadocJar'] }.configureEach { dependsOn 'generateTags' }
}

// ---------------------------------------------------------------------------------------------------------------------
// Mixin config scaffolding
// ---------------------------------------------------------------------------------------------------------------------

tasks.register('generateMixinJson') {
    group = 'cleanroom helpers'
    description = 'Creates missing mixin configuration files listed in mixin_configs'
    def missingConfigs = propertyStringList('mixin_configs').findAll { config ->
        !file("src/main/resources/${config}").exists()
    }
    onlyIf {
        propertyBool('use_mixins') && propertyBool('generate_mixins_json') && !missingConfigs.isEmpty()
    }
    doLast {
        for (String mixinConfig : missingConfigs) {
            file("src/main/resources/${mixinConfig}") << """{
\t"package": "${propertyString('mixin_package')}",
\t"required": true,
\t"target": "@env(DEFAULT)",
\t"minVersion": "0.8.7",
\t"compatibilityLevel": "JAVA_${propertyString('java_version')}",
\t"setSourceFile": true,
\t"mixins": [],
\t"server": [],
\t"client": []
}
"""
        }
    }
}

processResources {
    inputs.property 'mod_id', propertyString('mod_id')
    inputs.property 'mod_name', propertyString('mod_name')
    inputs.property 'mod_version', propertyString('mod_version')
    inputs.property 'mod_description', propertyString('mod_description')
    inputs.property 'mod_authors', "${propertyStringList('mod_authors', ',').join(', ')}"
    inputs.property 'mod_credits', propertyString('mod_credits')
    inputs.property 'mod_url', propertyString('mod_url')
    inputs.property 'mod_update_json', propertyString('mod_update_json')
    inputs.property 'mod_logo_path', propertyString('mod_logo_path')
    inputs.property 'mod_issue_tracker', propertyString('mod_issue_tracker')

    filesMatching(['mcmod.info', 'pack.mcmeta']) { fcd ->
        fcd.expand(
                'mod_id': propertyString('mod_id'),
                'mod_name': propertyString('mod_name'),
                'mod_version': propertyString('mod_version'),
                'mod_description': propertyString('mod_description'),
                'mod_authors': "${propertyStringList('mod_authors', ',').join(', ')}",
                'mod_credits': propertyString('mod_credits'),
                'mod_url': propertyString('mod_url'),
                'mod_update_json': propertyString('mod_update_json'),
                'mod_logo_path': propertyString('mod_logo_path'),
                'mod_issue_tracker': propertyString('mod_issue_tracker')
        )
    }

    if (useAccessTransformer) {
        rename '(.+_at.cfg)', 'META-INF/$1'
    } else {
        exclude '**/*_at.cfg'
    }

    dependsOn 'generateMixinJson'
}

jar {
    archiveClassifier = 'dev'
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE

    if (!configurations.contain.isEmpty()) {
        into('/') {
            from configurations.contain
        }
    }

    manifest {
        def attribute_map = [:]
        attribute_map['ModType'] = 'CRL'
        if (!configurations.contain.isEmpty()) {
            attribute_map['ContainedDeps'] = configurations.contain.collect { it.name }.join(' ')
            attribute_map['NonModDeps'] = true
        }
        if (isCoremod) {
            attribute_map['FMLCorePlugin'] = propertyString('coremod_plugin_class_name')
            if (propertyBool('coremod_includes_mod')) {
                attribute_map['FMLCorePluginContainsFMLMod'] = true
            }
        }
        if (useAccessTransformer) {
            attribute_map['FMLAT'] = propertyString('access_transformer_locations')
        }
        if (useMixins) {
            def mixinConfigs = propertyStringList('mixin_configs')
            if (!mixinConfigs.isEmpty()) {
                attribute_map['MixinConfigs'] = mixinConfigs.join(',')
            }
        }
        def mixinConnectorClass = propertyString('mixin_connector_class')
        if (!mixinConnectorClass.isEmpty()) {
            attribute_map['MixinConnector'] = mixinConnectorClass
        }
        attributes(attribute_map)
    }

    finalizedBy(tasks.named(useShadow ? 'remapShadowJar' : 'remapJar').get())
}

shadowJar {
    //noinspection GroovyAssignabilityCheck,GroovyAccessibility
    configurations = [project.configurations.shadow]
    archiveClassifier = 'shadow'
}

if (!useShadow) {
    // Shadow wires shadowJar into assemble; keep the output clean when shading is off
    tasks.named('shadowJar').configure { enabled = false }
}

test {
    useJUnitPlatform()
    javaLauncher.set(javaToolchains.launcherFor {
        languageVersion = JavaLanguageVersion.of(javaVersionNumber)
    })
    if (propertyBool('show_testing_output')) {
        testLogging {
            showStandardStreams = true
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

// Remove the annoying blue icon from IntelliJ, use the run configurations below instead
tasks.matching { it.name == 'genIntellijRuns' }.configureEach {
    enabled = false
}

idea {
    module {
        inheritOutputDirs = true
    }
    project {
        settings {
            runConfigurations {
                '1. Run Client'(Gradle) {
                    taskNames = ['runClient']
                }
                '2. Run Server'(Gradle) {
                    taskNames = ['runServer']
                }
                '3. Build'(Gradle) {
                    taskNames = ['build']
                }
                '4. Gen Sources'(Gradle) {
                    taskNames = ['genSources']
                }
            }
            compiler.javac {
                afterEvaluate {
                    javacAdditionalOptions = '-encoding utf8'
                    moduleJavacAdditionalOptions = [
                            (project.name + '.main'): tasks.compileJava.options.compilerArgs.collect { '"' + it + '"' }.join(' ')
                    ]
                }
            }
        }
    }
}

tasks.register('cleanroomAfterSync') {
    group = 'cleanroom helpers'
    dependsOn 'generateTags', 'generateMixinJson'
}

idea.project.settings {
    taskTriggers {
        afterSync 'cleanroomAfterSync'
    }
}

String parserChangelog() {
    if (!file('CHANGELOG.md').exists()) {
        throw new GradleException('publish_with_changelog is true, but CHANGELOG.md does not exist in the workspace!')
    }
    String parsedChangelog = changelog.renderItem(
            changelog.get(propertyString('mod_version')).withHeader(false).withEmptySections(false),
            Changelog.OutputType.MARKDOWN)
    if (parsedChangelog.isEmpty()) {
        throw new GradleException('publish_with_changelog is true, but the changelog for the latest version is empty!')
    }
    return parsedChangelog
}

if (propertyBool('publish_to_curseforge')) {
    assertProperty 'curseforge_project_id'
    apply plugin: 'net.darkhax.curseforgegradle'
    tasks.register('curseforge', TaskPublishCurseForge) {
        group 'publishing'
        description "Uploads CurseForge project ${propertyString('curseforge_project_id')}"
    }
}

apply from: 'gradle/scripts/publishing.gradle'
apply from: 'gradle/scripts/extra.gradle'

// ---------------------------------------------------------------------------------------------------------------------
// Packaged output
// ---------------------------------------------------------------------------------------------------------------------

// The MCP named jar only a development instance may load: it is also the one copied into run/<side>/mods.
// A normal client needs the remapped (SRG named) jar instead, see the name given to remapJar below.
tasks.named('jar').configure {
    archiveFileName = "ModularGrid-1.12.2-cleanroom-${propertyString('mod_version')}-dev.jar"
}

// The jar that is handed out: remapped to SRG names, which is what Forge remaps back to MCP at runtime.
tasks.matching { it.name == 'remapJar' }.configureEach {
    archiveFileName = "ModularGrid-1.12.2-cleanroom-${propertyString('mod_version')}.jar"
}

// The sources of the same build, for reading the addon instead of running it.
tasks.matching { it.name == 'sourcesJar' }.configureEach {
    archiveFileName = "ModularGrid-1.12.2-cleanroom-${propertyString('mod_version')}-source.jar"
}
