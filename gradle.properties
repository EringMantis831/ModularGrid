# Gradle Properties
org.gradle.jvmargs = -Xmx3G
# Gradle needs a JDK 25 (or newer) to run this workspace.
# If Gradle cannot auto-detect your JDK 25, list it here (paths are comma separated), e.g.
# org.gradle.java.installations.paths=C:/Program Files/Java/jdk-25.0.4.1

# Cleanroom Loader
# Releases: https://github.com/CleanroomMC/Cleanroom/releases
cleanroom_version = 0.6.0-alpha

# Compilation Options
# Cleanroom 0.6.x requires Java 25
java_version = 25
generate_sources_jar = true
generate_javadocs_jar = false

# Testing
enable_junit_testing = true
show_testing_output = false

# Shadow / jar-in-jar
# enable_shadow bundles the "shadow" configuration into a single shaded jar
enable_shadow = false
# Set this to true if you want to use old LWJGL2 methods.
# WARNING: Using LWJGL2 is no longer recommend, and some methods in LWJGL2 will be unavailable.
# If you are porting an old mod lazily just set this to true.
enable_lwjglx = true

# Mod Information
# HIGHLY RECOMMEND complying with SemVer for mod_version: https://semver.org/
mod_version = 1.0.0
root_package = com.modulargrid
mod_id = modulargrid
mod_name = ModularGrid

# Modular Machinery: Community Edition (the mod this addon targets)
# CurseForge file id, see gradle/scripts/dependencies.gradle
# https://www.curseforge.com/minecraft/mc-mods/modularmachinery-community-edition/files
mmce_curse_file = modularmachinery-community-edition-817377:7372951
# CraftTweaker (hard dependency of MMCE)
crafttweaker_curse_file = crafttweaker-239197:8051578
# IndustrialCraft 2 (optional neighbour, the access plug can also talk to its energy net)
# https://www.curseforge.com/minecraft/mc-mods/industrial-craft/files
ic2_curse_file = industrial-craft-242638:3838713
# Flux Networks (optional neighbour, the access plug can become a device of its own on the network)
# https://www.curseforge.com/minecraft/mc-mods/flux-networks/files
fluxnetworks_curse_file = flux-networks-248020:3178199
# Circulation Flow Networks (optional neighbour, wireless energy network)
# https://www.curseforge.com/minecraft/mc-mods/circulation-flow-networks/files
circulation_networks_curse_file = circulation-flow-networks-1519385:8937478

# Mod Metadata (Optional)
mod_description =
mod_url =
# A url where the mod's update json can be fetched
# Wiki: https://docs.minecraftforge.net/en/1.12.x/gettingstarted/autoupdate/#forge-update-checker
mod_update_json =
# Delimit authors with commas
mod_authors =
mod_credits =
mod_logo_path =
mod_issue_tracker =

# Mapping Properties (MCP)
mapping_channel = stable
mapping_version = 39-1.12

# Run Configurations
# If multiple arguments/tweak classes are stated, use spaces as the delimiter
minecraft_username = Developer
extra_jvm_args =
extra_tweak_classes =
enable_foundation_debug = false

# Maven Publishing (Provide secret: MAVEN_USER, MAVEN_PASS)
publish_to_maven = false
# Good for debugging artifacts before uploading to remote maven
# GitHub actions won't run if this is true, test this by running the task `publishToMavenLocal`
publish_to_local_maven = false
maven_name = ${mod_name}
maven_url =

# Publishing
# release_type can only be: release, beta or alpha (applies to CurseForge / Modrinth)
release_type = release
publish_with_changelog = ${{ it.file('CHANGELOG.md').exists() }}
# Which sides the mod supports, at least one of them must be true
# CurseForge requires this, Modrinth only stores it project-wide and thus cannot be set while publishing
client_side = true
server_side = true

# Publishing to CurseForge (Provide secret: CURSEFORGE_TOKEN)
publish_to_curseforge = false
# CurseForge project ID must be the numerical ID and not the slug
curseforge_project_id =
curseforge_debug = false

# Publishing to Modrinth (Provide secret: MODRINTH_TOKEN), the token must have the `CREATE_VERSION` and `PROJECT_WRITE` permissions
publish_to_modrinth = false
modrinth_project_id =
# Allows gradle to publish updated READMEs to the project body (via the modrinthSyncBody task)
modrinth_sync_readme = false
modrinth_debug = false

# If any properties changes below this line, refresh gradle again to ensure everything is working correctly.
# ----------------------------------------------------------------------------------------------------------------------

# Tags
# A build-time generated class holding values that could change between builds, such as the mod version
# The class is generated into build/generated/sources/tags, values come from the tags.properties file
use_tags = true
tag_class_name = ${root_package}.Tags

# Access Transformers
# A way to change visibility of Minecraft's classes, methods and fields
# AT files should be in the root of src/main/resources with the filename formatted as: `mod_id_at.cfg`
# Use the property `access_transformer_locations` to state custom AT files if you aren't using the default `mod_id_at.cfg` location
# If multiple locations are stated, use spaces as the delimiter
# WARNING: Use MCP names in the AT file, Unimined remaps them to SRG names when building
use_access_transformer = false
access_transformer_locations = ${mod_id}_at.cfg

# Mixins
# Mixins are built into Cleanroom Loader (CleanMix), no extra dependency is required.
# Wiki: https://cleanroommc.com/wiki/forge-mod-development/mixin/preface
# Only use mixins once you understand the underlying structure
use_mixins = true
# Delimit configs with spaces. Full filenames only (e.g. mixins.modid.json)
# Non-empty configs are written to the jar manifest as MixinConfigs (comma-delimited)
mixin_configs = mixins.${mod_id}.json mixins.${mod_id}.compat.json
# Package holding the mixin classes, used by the generateMixinJson task
mixin_package = ${root_package}.mixin
# Generate missing configs from mixin_configs (full resource filenames, e.g. mixins.modid.json)
generate_mixins_json = false
# Optional fully-qualified class implementing org.spongepowered.asm.mixin.connect.IMixinConnector
# When non-empty, written to the jar manifest as MixinConnector
mixin_connector_class =

# Coremods
# The most powerful way to change java classes at runtime, it is however very primitive with little documentation.
# Only make a coremod if you are absolutely sure of what you are doing
# Change the property `coremod_includes_mod` to false if your coremod doesn't have a @Mod annotation
# You MUST state a class name for `coremod_plugin_class_name` if you are making a coremod, the class should implement `IFMLLoadingPlugin`
is_coremod = false
coremod_includes_mod = true
coremod_plugin_class_name =

# AssetMover
# Convenient way to allow downloading of assets from official vanilla Minecraft servers, CurseForge, or any direct links
# Documentation: https://github.com/CleanroomMC/AssetMover
use_asset_mover = false
asset_mover_version = 2.5
