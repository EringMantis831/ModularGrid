; Access Transformer file for ModularGrid.
;
; Access Transformers change the visibility of Minecraft's classes, methods and fields.
; Use MCP names here, Unimined remaps them to SRG names while building.
;
; To enable them:
;   1. set use_access_transformer = true in gradle.properties (file location defaults to <mod_id>_at.cfg)
;   2. uncomment / add your entries below
;
; Syntax: <access modifier> <fully qualified class name> <field|method> <name>[ <descriptor>] [# comment]
;   public / protected / private / public-f / public-f (f = final), or -public / -protected / -private to remove
;
; Example (grants access to Minecraft#fileResourcepacks):
; public net.minecraft.client.Minecraft fileResourcepacks # Example MCP name AT entry
